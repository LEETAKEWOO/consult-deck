<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#FFFFFF">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="보험컨설팅">
<meta name="robots" content="noindex, nofollow">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-192.png">
<title>보험컨설팅</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;600;700;800&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: 상단 진행 바 + 가운데 슬라이드 + 하단 조작 줄과 주제 탭. 흰 바탕·회색 카드·굵은 고딕(토스식), 미래에셋 오렌지·블루 */
:root{
  --bg:#FFFFFF; --card:#F2F4F6; --card2:#E8EBEF; --ink:#191F28; --ink2:#4E5968; --muted:#6B7684; --muted2:#8B95A1; --line:#E5E8EB;
  --brand:#F58220; --brand-text:#C95F0A; --brand-soft:#FFF1E4;
  --navy:#043B72; --navy-text:#0B4C8C; --navy-soft:#E7EEF7; --on-navy:#FFFFFF;
  --ok:#0F8A4B; --ok-soft:#E4F5EC; --warn:#D93A3F; --warn-soft:#FDECEC;
  --t-start:#F58220; --t-cancer:#E2552E; --t-vessel:#C8355F; --t-brain:#2F6FD0; --t-heart:#D63A55; --t-surgery:#0E8F8F; --t-disab:#6D52C7; --t-pension:#0B4C8C; --t-life:#2C7A4F; --t-total:#C95F0A;
  --f:"Noto Sans KR","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#111215; --card:#1D1E23; --card2:#27282E; --ink:#F2F3F5; --ink2:#C5C9D0; --muted:#9CA1AA; --muted2:#7E848D; --line:#2B2D34;
  --brand:#FF8A2A; --brand-text:#FFA052; --brand-soft:#2E2116;
  --navy:#0E3E73; --navy-text:#8DB8F0; --navy-soft:#16273D; --on-navy:#FFFFFF;
  --ok:#4FC587; --ok-soft:#15301F; --warn:#FF7A7E; --warn-soft:#3A1D1F;
  --t-start:#FF9A45; --t-cancer:#FF8A66; --t-vessel:#F07A9C; --t-brain:#7FAEF2; --t-heart:#F7849A; --t-surgery:#4FCBCB; --t-disab:#AE9AF2; --t-pension:#8DB8F0; --t-life:#6FD19A; --t-total:#FFA052;
  color-scheme:dark;
}}
:root[data-theme="dark"]{
  --bg:#111215; --card:#1D1E23; --card2:#27282E; --ink:#F2F3F5; --ink2:#C5C9D0; --muted:#9CA1AA; --muted2:#7E848D; --line:#2B2D34;
  --brand:#FF8A2A; --brand-text:#FFA052; --brand-soft:#2E2116;
  --navy:#0E3E73; --navy-text:#8DB8F0; --navy-soft:#16273D; --on-navy:#FFFFFF;
  --ok:#4FC587; --ok-soft:#15301F; --warn:#FF7A7E; --warn-soft:#3A1D1F;
  --t-start:#FF9A45; --t-cancer:#FF8A66; --t-vessel:#F07A9C; --t-brain:#7FAEF2; --t-heart:#F7849A; --t-surgery:#4FCBCB; --t-disab:#AE9AF2; --t-pension:#8DB8F0; --t-life:#6FD19A; --t-total:#FFA052;
  color-scheme:dark;
}
[hidden]{display:none!important}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--f);font-size:16px;line-height:1.6;letter-spacing:-.01em;word-break:keep-all;-webkit-font-smoothing:antialiased}
button,input{font:inherit;color:inherit}
a{color:inherit}
button:focus-visible,input:focus-visible,a:focus-visible{outline:2px solid var(--brand);outline-offset:2px}
.num{font-variant-numeric:tabular-nums}

.app{display:grid;grid-template-rows:auto minmax(0,1fr) auto;grid-template-columns:minmax(0,1fr);height:100%}

/* 상단 */
.top{display:flex;align-items:center;gap:16px;min-height:56px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));box-shadow:inset 0 -1px 0 var(--line);background:var(--bg)}
.brand{display:flex;align-items:center;gap:8px;font-weight:800;font-size:16px;letter-spacing:-.03em;white-space:nowrap}
.brand svg{width:22px;height:22px;flex:none}
.where{display:flex;align-items:center;gap:10px;min-width:0;flex:1}
.where b{font-size:14px;font-weight:700;color:var(--tc);white-space:nowrap}
.dots{display:flex;gap:5px;align-items:center}
.dots i{width:6px;height:6px;border-radius:50%;background:var(--card2);transition:width .2s,background .2s}
.dots i.on{width:18px;border-radius:4px;background:var(--tc)}
.dots i.done{background:color-mix(in srgb,var(--tc) 45%,var(--card2))}
.who-top{font-size:13px;color:var(--muted);white-space:nowrap}
@media (max-width:640px){.who-top,.brand span{display:none}}

/* 무대 */
.stage{overflow:auto;padding-block:28px 36px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.slide{max-width:1080px;margin:0 auto;display:flex;flex-direction:column;gap:22px}
.slide.enter{animation:enter .32s cubic-bezier(.2,.7,.2,1)}
@keyframes enter{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion: reduce){.slide.enter{animation:none}}

.head{display:flex;flex-direction:column;gap:10px}
.eyebrow{font-size:14px;font-weight:700;color:var(--tc)}
h1,h2,h3{margin:0;font-weight:800;letter-spacing:-.04em;text-wrap:balance;color:var(--ink)}
h1{font-size:clamp(34px,5vw,58px);line-height:1.22}
h2{font-size:clamp(26px,3.4vw,40px);line-height:1.3}
h3{font-size:18px;font-weight:700;letter-spacing:-.025em}
.lead{margin:0;font-size:clamp(15px,1.4vw,17px);color:var(--muted);max-width:62ch}
.src{margin:0;font-size:12px;line-height:1.65;color:var(--muted2)}
.k{display:block;font-size:14px;font-weight:600;color:var(--muted)}

.card{background:var(--card);border-radius:20px;padding:22px 24px;display:flex;flex-direction:column;gap:10px;min-width:0}
.card.tint{background:color-mix(in srgb,var(--tc) 10%,var(--card))}
.card.navy{background:var(--navy);color:var(--on-navy)}
.card.navy .k,.card.navy .d{color:rgba(255,255,255,.75)}
.card.navy .big{color:#fff}
.card.warn{background:var(--warn-soft)}
.card.warn .big{color:var(--warn)}
.d{font-size:14.5px;color:var(--muted);line-height:1.55}
.d.ink{color:var(--ink2);font-size:15.5px}
.big{font-weight:800;letter-spacing:-.04em;line-height:1.12;font-size:clamp(30px,3.4vw,42px);font-variant-numeric:tabular-nums}
.big small{font-size:.44em;font-weight:600;letter-spacing:-.01em;margin-left:2px}
.big.c{color:var(--tc)}
.grid2,.grid3,.grid4{display:grid;gap:12px}
.grid2{grid-template-columns:repeat(2,minmax(0,1fr))}
.grid3{grid-template-columns:repeat(3,minmax(0,1fr))}
.grid4{grid-template-columns:repeat(4,minmax(0,1fr))}
@media (max-width:900px){.grid4{grid-template-columns:repeat(2,minmax(0,1fr))}.grid3{grid-template-columns:minmax(0,1fr)}}
@media (max-width:620px){.grid2,.grid4{grid-template-columns:minmax(0,1fr)}}
.split{display:grid;grid-template-columns:minmax(0,1.2fr) minmax(0,1fr);gap:12px;align-items:start}
@media (max-width:880px){.split{grid-template-columns:minmax(0,1fr)}}
.col{display:flex;flex-direction:column;gap:12px;min-width:0}
button.card{border:0;text-align:left;cursor:pointer;font:inherit;color:inherit}
.tap{color:var(--brand-text);font-weight:700;font-size:14px}
.card.navy .tap{color:#FFB46E}
.callout{margin:0;padding:16px 20px;border-radius:16px;background:color-mix(in srgb,var(--tc) 9%,var(--bg));font-weight:600;color:var(--ink2)}

/* 위험 신호 목록 */
.risks{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
@media (max-width:900px){.risks{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:560px){.risks{grid-template-columns:minmax(0,1fr)}}
.risk{background:var(--card);border-radius:16px;padding:14px 16px;display:flex;flex-direction:column;gap:3px}
.risk b{font-size:15.5px;font-weight:700;display:flex;align-items:center;gap:8px}
.risk b::before{content:"";width:7px;height:7px;border-radius:50%;background:var(--tc);flex:none}
.risk span{font-size:13.5px;color:var(--muted);padding-left:15px}

/* 표 */
.tbl-wrap{overflow-x:auto;background:var(--card);border-radius:20px;padding:6px 8px}
table.tbl{width:100%;border-collapse:collapse;font-size:14.5px;min-width:640px}
.tbl th,.tbl td{padding:11px 12px;text-align:left;border-bottom:1px solid var(--line);white-space:nowrap}
.tbl th{font-size:12.5px;font-weight:600;color:var(--muted)}
.tbl tr:last-child td{border-bottom:0}
.tbl td.r,.tbl th.r{text-align:right;font-variant-numeric:tabular-nums}
.tbl tr.hl td{background:color-mix(in srgb,var(--tc) 10%,transparent);font-weight:700}
.tbl .bar{display:inline-block;height:8px;border-radius:4px;background:var(--tc);vertical-align:middle;margin-right:8px;opacity:.85}
table.mini{width:100%;border-collapse:collapse;font-size:14.5px}
.mini td{padding:9px 0;border-bottom:1px solid var(--line)}
.mini tr:last-child td{border-bottom:0}
.mini td.r{text-align:right;font-weight:700;font-variant-numeric:tabular-nums}

/* 비용 막대 */
.costs{display:flex;flex-direction:column;gap:12px}
.cost{display:grid;grid-template-columns:minmax(0,200px) minmax(0,1fr) 110px;gap:14px;align-items:center}
.cost .nm{font-weight:700;font-size:15px}
.cost .nm small{display:block;font-weight:400;color:var(--muted);font-size:12.5px}
.cost .tr{height:12px;background:var(--card2);border-radius:6px;overflow:hidden}
.cost .tr i{display:block;height:100%;background:var(--tc);border-radius:6px}
.cost .v{text-align:right;font-weight:800;font-variant-numeric:tabular-nums}
@media (max-width:620px){.cost{grid-template-columns:minmax(0,1fr) auto}.cost .tr{grid-column:1/-1;grid-row:2}}
.sum{display:flex;justify-content:space-between;align-items:baseline;gap:12px;flex-wrap:wrap;border-top:2px solid var(--ink);padding-top:14px}
.sum .big{color:var(--tc)}

/* 입력 */
.field{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;font-size:15px;font-weight:500}
.amt{display:flex;align-items:center;gap:8px}
.amt input{width:120px;max-width:100%;height:44px;border:1px solid var(--line);border-radius:12px;padding:0 12px;background:var(--bg);text-align:right;font-weight:700;font-variant-numeric:tabular-nums}
.amt span{font-size:13px;color:var(--muted)}
.seg{display:inline-flex;background:var(--card2);padding:3px;border-radius:12px;gap:2px}
.seg button{border:0;background:transparent;border-radius:9px;padding:7px 13px;font-size:14px;font-weight:600;color:var(--muted);cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--bg);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.1)}

/* 퀴즈 */
.qz{background:var(--card);border-radius:18px;padding:18px 20px;display:flex;flex-direction:column;gap:12px}
.qz p{margin:0;font-weight:600;font-size:16px}
.qz .ans{display:flex;gap:8px;flex-wrap:wrap}
.qz .ans button{border:0;background:var(--bg);border-radius:12px;padding:9px 16px;font-weight:700;font-size:14px;cursor:pointer}
.qz .out{padding:12px 14px;border-radius:12px;background:var(--warn-soft);font-size:15px}
.qz .out b{color:var(--warn)}
.qz.ok .out{background:var(--ok-soft)}
.qz.ok .out b{color:var(--ok)}

/* 포함 관계 */
.nest{border-radius:18px;padding:14px 16px 16px;display:flex;flex-direction:column;gap:10px;background:color-mix(in srgb,var(--tc) 6%,var(--card))}
.nest.l2{background:color-mix(in srgb,var(--tc) 13%,var(--card))}
.nest.l3{background:color-mix(in srgb,var(--tc) 22%,var(--card));padding:12px 14px}
.nest .lab{display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap;align-items:baseline}
.nest .lab b{font-size:16px;font-weight:800}
.nest .lab code{font-family:var(--f-mono);font-size:12px;color:var(--muted)}
.nest .pct{font-weight:800;color:var(--tc);font-variant-numeric:tabular-nums}
.nest .tag{font-size:12.5px;color:var(--muted);width:100%}
.nrow{display:flex;gap:10px;flex-wrap:wrap}
.nrow > *{flex:1 1 150px;min-width:0}
.loose{border:1.5px dashed var(--line);border-radius:14px;padding:12px 14px;background:var(--bg);display:flex;flex-direction:column;gap:2px;font-size:14px}
.loose b{font-weight:700}
.insight{display:flex;flex-direction:column;gap:6px;padding:18px 20px;border-radius:18px;background:var(--warn-soft)}
.insight b{font-size:20px;font-weight:800;letter-spacing:-.03em;color:var(--warn)}
.insight span{font-size:14px;color:var(--ink2)}

/* 첫 화면 */
.hero-h{display:flex;flex-direction:column;gap:12px}
.hero-grid{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr) minmax(0,1.25fr);gap:12px}
@media (max-width:900px){.hero-grid{grid-template-columns:minmax(0,1fr)}}
.hero-big{margin:0;font-size:clamp(28px,3vw,38px);line-height:1.28;font-weight:600;letter-spacing:-.04em;color:var(--ink2)}
.hero-big b{font-weight:800;color:var(--ink)}
.hero-big em{font-style:normal;color:var(--brand-text)}
.card .foot{margin-top:auto;font-size:14px;color:var(--muted)}
.maxbar{display:flex;height:12px;border-radius:7px;overflow:hidden;gap:2px;background:rgba(255,255,255,.12)}
.maxbar i{display:block;height:100%}
.maxleg{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:7px}
.maxleg li{display:grid;grid-template-columns:10px minmax(0,1fr) auto;gap:10px;align-items:center;font-size:14px;color:rgba(255,255,255,.85)}
.maxleg i{width:10px;height:10px;border-radius:3px}
.maxleg b{color:#fff;font-variant-numeric:tabular-nums}
.vs{font-size:13.5px;color:rgba(255,255,255,.78);padding-top:10px;border-top:1px solid rgba(255,255,255,.16)}
.vs b{color:#FFB46E}
.chan{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
@media (max-width:620px){.chan{grid-template-columns:minmax(0,1fr)}}
a.ch,div.ch{display:grid;grid-template-columns:48px minmax(0,1fr) auto;gap:14px;align-items:center;background:var(--card);border-radius:20px;padding:16px 18px;text-decoration:none;transition:background .15s}
a.ch:hover{background:var(--card2)}
.ch .ic{width:48px;height:48px;border-radius:14px;display:grid;place-items:center}
.ch .ic svg{width:24px;height:24px}
.ch .ic.blog{background:color-mix(in srgb,#19B35A 16%,var(--card));color:#139A4C}
.ch .ic.yt{background:color-mix(in srgb,#E5383B 14%,var(--card));color:#D42F32}
.ch .t{display:flex;flex-direction:column;min-width:0}
.ch .t span{font-size:13px;color:var(--muted);font-weight:600}
.ch .t b{font-size:17px;font-weight:800;letter-spacing:-.03em;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ch .t em{font-style:normal;font-size:13.5px;color:var(--muted)}
.ch .go{font-size:14px;font-weight:700;color:var(--brand-text);white-space:nowrap}
div.ch .go{color:var(--muted2);font-weight:500;font-size:13px;white-space:normal;text-align:right;max-width:140px}
.me{display:flex;align-items:center;gap:10px;font-size:14px;color:var(--muted)}
.me b{color:var(--ink);font-weight:700}
.av{width:34px;height:34px;border-radius:50%;background:var(--brand);color:#1A0C00;display:grid;place-items:center;font-weight:800;font-size:12.5px;flex:none;object-fit:cover}

/* 치료 동선 */
.route{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}
@media (max-width:560px){.route{grid-template-columns:repeat(2,minmax(0,1fr))}}
.step{border:0;background:var(--card);border-radius:18px;padding:14px 16px;display:flex;flex-direction:column;gap:4px;text-align:left;cursor:pointer;position:relative;transition:background .15s}
.step .n{font-size:12.5px;font-weight:700;color:var(--muted2);font-variant-numeric:tabular-nums}
.step b{font-size:17px;font-weight:800;letter-spacing:-.03em}
.step em{font-style:normal;font-size:12.5px;color:var(--muted)}
.step .sil{position:absolute;top:12px;right:12px;font-size:11px;font-weight:700;color:var(--navy-text);background:var(--navy-soft);padding:2px 8px;border-radius:999px}
.step.past{background:color-mix(in srgb,var(--tc) 9%,var(--card))}
.step.now{background:var(--tc);color:#fff}
.step.now .n,.step.now em{color:rgba(255,255,255,.8)}
.qa{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:12px}
@media (max-width:700px){.qa{grid-template-columns:minmax(0,1fr)}}
.qa .card .t{font-size:clamp(19px,2vw,24px);font-weight:800;letter-spacing:-.03em;line-height:1.4}
.qa .hide .t{filter:blur(8px);user-select:none}
.btns{display:flex;gap:8px;flex-wrap:wrap}
.btn{border:0;border-radius:14px;height:48px;padding:0 20px;background:var(--navy);color:#fff;font-weight:700;cursor:pointer}
.btn.soft{background:var(--card);color:var(--ink)}

/* 체인 (암 → 혈관) */
.chain{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px;position:relative}
@media (max-width:620px){.chain{grid-template-columns:repeat(2,minmax(0,1fr))}}
.link{background:var(--card);border-radius:18px;padding:18px;display:flex;flex-direction:column;gap:6px;position:relative}
.link .n{font-size:12.5px;font-weight:700;color:var(--muted2)}
.link b{font-size:22px;font-weight:800;letter-spacing:-.03em}
.link span{font-size:13.5px;color:var(--muted)}
.link.end{background:var(--tc);color:#fff}
.link.end .n,.link.end span{color:rgba(255,255,255,.85)}
.link.end.hide b{filter:blur(7px)}

/* 터짐·막힘 */
.vs2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
@media (max-width:620px){.vs2{grid-template-columns:minmax(0,1fr)}}
.vs2 svg{width:100%;height:auto;max-width:260px}
.vs2 .pipe{fill:none;stroke:var(--tc);stroke-width:14;stroke-linecap:round}
.vs2 .wall{fill:none;stroke:color-mix(in srgb,var(--tc) 35%,var(--card));stroke-width:26;stroke-linecap:round}
.vs2 .blot{fill:var(--tc);opacity:.85}
.vs2 .plug{fill:var(--ink);opacity:.75}

/* 피라미드 */
.pyr{display:flex;flex-direction:column;align-items:center;gap:6px}
.tier{box-sizing:border-box;width:var(--w);max-width:100%;border-radius:12px;padding:12px 16px;display:grid;grid-template-columns:minmax(0,1fr) auto;gap:2px 12px;align-items:center;background:color-mix(in srgb,var(--tc) var(--mix),var(--card))}
.tier b{font-weight:800;font-size:15.5px}
.tier span{font-size:12.5px;color:var(--muted);grid-column:1}
.tier em{font-style:normal;font-size:12px;font-weight:700;padding:3px 9px;border-radius:999px;grid-row:1/3;grid-column:2;background:var(--bg);color:var(--ink2)}
.tier em.must{background:var(--tc);color:#fff}
@media (max-width:620px){.tier{width:calc(70% + (var(--w) - 42%) * 0.517)!important;padding:10px 12px}.tier b{font-size:14.5px}.tier span{font-size:11.5px}.tier em{font-size:11px;padding:3px 7px}}
.jong{display:flex;flex-direction:column;gap:10px}
.jong .row{display:grid;grid-template-columns:64px 120px minmax(0,1fr);gap:14px;align-items:center;background:var(--card);border-radius:16px;padding:14px 18px}
.jong .row b{font-size:22px;font-weight:800;color:var(--tc)}
.jong .row .lim{font-size:13px;font-weight:700;color:var(--ink2)}

.xi b{font-size:22px;font-weight:800;letter-spacing:-.03em}
.xi svg,.xi > span{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;font-weight:800}
.xi.ok{background:var(--ok-soft);color:var(--ok)}

.xi.no{background:var(--warn-soft);color:var(--warn)}

.xi.no > span{background:var(--warn);color:#fff}

/* 뇌 이야기 */
.bstory{display:grid;grid-template-columns:minmax(0,1.15fr) minmax(0,1fr);gap:16px;align-items:center}

.bs-out{border-radius:22px;padding:16px;display:flex;flex-direction:column;gap:12px;box-shadow:inset 0 0 0 2px transparent;transition:background .3s,box-shadow .3s}
.bs-out.show{background:color-mix(in srgb,var(--tc) 9%,var(--card));box-shadow:inset 0 0 0 2px var(--tc)}
.bs-lab{font-size:14px;font-weight:800;color:var(--tc);letter-spacing:-.02em;transition:opacity .3s}
.bs-lab code{font-family:var(--f-mono);font-size:12px;color:var(--muted);font-weight:500;margin-left:6px}
.bs-out:not(.show) > .bs-lab{opacity:0}
.bs-row{display:grid;grid-template-columns:minmax(0,1.5fr) minmax(0,1fr);gap:10px}
.bs-mid{border-radius:18px;padding:12px;display:flex;flex-direction:column;gap:8px;transition:background .3s}
.bs-mid.show{background:color-mix(in srgb,var(--tc) 16%,var(--card))}
.bs-mid:not(.show) > .bs-lab{opacity:0}
.bs-ins{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.bs-in{background:var(--bg);border-radius:14px;padding:14px 10px;text-align:center;font-weight:800;font-size:17px;display:flex;flex-direction:column}

.bs-side{display:flex;flex-direction:column;gap:8px}
.bs-i64,.bs-etc{border-radius:14px;padding:12px;display:flex;flex-direction:column;position:relative;background:var(--bg);border:1.5px dashed var(--line);opacity:0;transition:opacity .3s}
.bs-i64.show,.bs-etc.show{opacity:1}
.bs-i64 b{font-family:var(--f-mono);font-size:18px}
.bs-etc b{font-size:14px}
.bs-i64 .mk{position:absolute;top:8px;right:10px;font-weight:800;font-size:18px;color:var(--muted)}
.bs-i64.no{border-color:var(--warn);background:var(--warn-soft)}
.bs-i64.no .mk{color:var(--warn)}
.bs-i64.ok{border-style:solid;border-color:var(--ok);background:var(--ok-soft)}
.bs-i64.ok .mk{color:var(--ok)}
.bs-i64.ok .mk svg{width:16px}
.bs-text{display:flex;flex-direction:column;gap:14px}
.bs-text .k{font-family:var(--f-mono);color:var(--tc)}
.bs-text p{margin:0;font-size:clamp(20px,2.2vw,27px);font-weight:700;letter-spacing:-.035em;line-height:1.45}
.bs-text p b{color:var(--tc);font-weight:800}
.bs-text .btn{align-self:flex-start}

/* 100명 */
.people{gap:20px}
.pp{display:flex;flex-direction:column;gap:8px}
.pp-h{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap}

.dots100{display:grid;grid-template-columns:repeat(50,minmax(0,1fr));gap:3px}

/* 심장 */
.card.dis{align-items:flex-start}
.card.dis.open{background:color-mix(in srgb,var(--tc) 10%,var(--card))}
.card.dis h3{font-size:22px}
.hgrid{display:grid;grid-template-columns:minmax(0,1.3fr) repeat(3,minmax(0,1fr));gap:8px;background:var(--card);border-radius:20px;padding:16px}
.hh{display:flex;flex-direction:column;align-items:center;text-align:center;padding:6px 4px}
.hh b{font-size:15px;font-weight:800;letter-spacing:-.03em}
.hh small{font-size:12px;color:var(--muted)}
.hr{display:flex;align-items:center;font-weight:800;font-size:15px;letter-spacing:-.03em;padding:10px 4px}
.hr.dim{color:var(--muted2)}
.hc{display:grid;place-items:center;border-radius:14px;min-height:58px;background:var(--bg)}
.hc.ok{background:var(--ok-soft);color:var(--ok)}
.hc.ok svg{width:26px;height:26px}
.hc.no{background:var(--warn-soft);color:var(--warn);font-weight:800;font-size:22px}
@media (max-width:560px){.hgrid{grid-template-columns:minmax(0,1.1fr) repeat(3,minmax(0,1fr));padding:10px;gap:5px}.hh b{font-size:12.5px}.hh small{font-size:10.5px}.hr{font-size:12.5px}}
.ecg{padding:14px 18px}
.ecg svg{width:100%;height:auto;max-height:110px;display:block}
.ecg path{fill:none;stroke-width:3;stroke-linecap:round;stroke-linejoin:round}
.ecg .eok{stroke:var(--ok)}
.ecg .ebad{stroke:var(--warn)}
.ecg .et{font-size:14px;fill:var(--muted);font-family:var(--f);font-weight:700}

/* 스스로 생각해 보기 */
.refl{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,240px),1fr));gap:12px}
.card.rf{align-items:flex-start;min-height:190px}

.rf.open .qm{background:var(--tc);color:#fff}
.rf .qm svg{width:24px;height:24px}
.rf b{font-size:20px;font-weight:800;letter-spacing:-.03em}

/* 종합 아코디언 */
.acc{display:flex;flex-direction:column;gap:10px}
.acc-i{background:var(--card);border-radius:20px;overflow:hidden}
.acc-h{width:100%;border:0;background:transparent;display:grid;grid-template-columns:40px minmax(0,1fr) auto 28px;gap:12px;align-items:center;padding:14px 18px;cursor:pointer;text-align:left}
.acc-h .ic{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;background:color-mix(in srgb,var(--c) 14%,var(--bg));color:var(--c)}
.acc-h .ic svg{width:22px;height:22px}
.acc-h b{font-size:17px;font-weight:800}
.acc-h .chev{font-size:22px;font-weight:700;color:var(--muted);text-align:center}
.acc-i .calc{padding:0 18px 16px}
.acc-i .crow{background:var(--bg)}
.risks.pick.prep{grid-template-columns:repeat(4,minmax(0,1fr))}
@media (max-width:1000px){.risks.pick.prep{grid-template-columns:repeat(2,minmax(0,1fr))}}
.prep button.risk.on{background:var(--tc)}
.card.endq{align-items:flex-start;background:color-mix(in srgb,var(--tc) 9%,var(--card));padding:26px 28px}
.card.endq h3{font-size:clamp(22px,2.6vw,30px);line-height:1.35}
.card.endq .huge{color:var(--tc)}
.peak{display:flex;gap:24px;align-items:center;flex-wrap:wrap;width:100%}
.peak .col{flex:1 1 260px}
.pq{font-size:clamp(18px,2vw,22px);font-weight:800;letter-spacing:-.03em;color:var(--tc)}

/* ===== v13 ===== */
.head.isq h2{font-size:clamp(30px,4.1vw,50px);line-height:1.25}
.qb{display:inline-grid;place-items:center;width:1.05em;height:1.05em;border-radius:.28em;background:var(--tc);color:#fff;font-size:.6em;font-weight:800;margin-right:.4em;vertical-align:.2em;letter-spacing:0}
.qline{font-size:clamp(24px,2.8vw,34px)!important;font-weight:800!important;letter-spacing:-.04em;line-height:1.3;color:var(--ink)}

.qz p{font-size:clamp(18px,1.9vw,22px);font-weight:800;letter-spacing:-.03em}
.reflect-q b{font-size:clamp(26px,3vw,36px)}
.big.red,.huge.red{color:var(--warn)}
.tlabel em{font-style:normal;color:var(--warn);font-weight:700}
.big.strike{color:var(--muted2);text-decoration:line-through;text-decoration-thickness:4px;text-decoration-color:var(--warn)}
.types3{display:flex;flex-direction:column;gap:8px}
.types3 div{display:flex;align-items:baseline;gap:12px;background:var(--bg);border-radius:14px;padding:12px 14px}

/* 그래서 중요한 건 */

/* 혈관 ?? */
.blank{display:inline-block;min-width:2.2em;text-align:center;color:var(--tc);border-bottom:4px solid var(--tc);padding:0 .1em;line-height:1.1}

.vtop{display:grid!important;grid-template-columns:200px minmax(0,1fr);gap:24px;align-items:center;padding:22px 28px}

.vx .vp{fill:color-mix(in srgb,var(--warn) 12%,var(--card2));transition:fill .3s}
.vx .vl{fill:#E5484D;transition:r .45s cubic-bezier(.3,.7,.3,1),fill .3s}

/* 뇌 이야기: 꽉 차게 */
.bstory{grid-template-columns:minmax(0,1.35fr) minmax(0,1fr);gap:24px;align-items:stretch}

.bs-lab{font-size:19px}

.sch-ts{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px}
.st{border:1px solid var(--line);background:var(--bg);border-radius:10px;padding:8px 4px;font:inherit;font-size:13px;font-weight:700;color:var(--ink);cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:1px}
.st em{font-style:normal;font-size:10px;color:var(--muted);font-weight:700}
.st.tk{background:var(--card2);color:var(--muted);cursor:default;border-color:transparent}
.st.on{background:var(--brand);border-color:var(--brand);color:#fff}
.sch-add{display:flex;gap:8px}
.sch-add input{flex:1;min-width:0;border:1px solid var(--line);border-radius:12px;padding:10px 12px;font:inherit;background:var(--bg);color:inherit}
.sch-add .btn{height:auto;padding:0 16px;white-space:nowrap}
.sch-add .btn:disabled{opacity:.45;cursor:default}
.sch-l{list-style:none;margin:0;padding:0;display:grid;gap:6px}
.sch-l li{display:flex;align-items:center;gap:10px;padding:9px 12px;border-radius:12px;background:var(--bg)}
.sch-l li b{font-size:14px;color:var(--navy-text)}.sch-l li span{flex:1;font-size:13.5px}
.sch-l li button{border:0;background:transparent;font-size:18px;color:var(--muted);cursor:pointer;line-height:1}
.sch-none{margin:0;padding:14px;border-radius:12px;background:var(--bg);font-size:13.5px;color:var(--muted)}
.sch-note{margin:0;font-size:11.5px;color:var(--muted)}
@media (max-width:1100px){.cl-wrap{grid-template-columns:1fr}}
@media (max-width:620px){.sch{grid-template-columns:1fr}.sch-ts{grid-template-columns:repeat(3,minmax(0,1fr))}}
.cl-wrap>*,.sch>*,.cl-box{min-width:0}@media (max-width:1100px){.cl-wrap{grid-template-columns:minmax(0,1fr)}}@media (max-width:620px){.sch{grid-template-columns:minmax(0,1fr)}.sd{min-height:0}.sch-add .btn{padding:0 12px}}
.sch-ts{grid-template-columns:repeat(3,minmax(0,1fr))}.st{padding:11px 4px;font-size:14px}
.sch-own{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:8px 10px 8px 14px;border-radius:12px;background:var(--bg);border:1px dashed var(--line)}
.sch-own label{font-size:13px;font-weight:700;color:var(--muted)}
.sch-own input{border:1px solid var(--line);border-radius:10px;padding:7px 10px;font:inherit;font-size:14px;background:var(--card);color:inherit}
/* 폰·아이패드 연동 */
.fset.sy{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px 16px 14px;gap:10px;margin-bottom:14px}
.fset.sy .ghost{background:var(--bg);border:1px solid var(--line)}
.sy-line{margin:0;font-size:14px;font-weight:600;display:flex;align-items:center;gap:8px}
.sy-line span::before{content:"";display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:8px;background:#b9bec8;vertical-align:1px}
.sy-line .sy-ok::before{background:#1f9d6b}.sy-line .sy-busy::before{background:#e8892b}.sy-line .sy-err::before{background:#d64545}.sy-line .sy-wait::before{background:#e8892b}
.sy-line .sy-err{color:#c03a3a}
.fset.sy .sf input{text-align:left}
.sy-row{display:flex;gap:10px;flex-wrap:wrap;margin-top:2px}
.sy-help{margin:2px 0 0;font-size:12.5px;color:var(--muted);line-height:1.55}
.sch-note .sy-err{color:#c03a3a}.sch-note .sy-ok{color:#1f9d6b}
/* 실손 세대 확인 */
.silg{margin-top:18px;background:var(--card);border:1px solid var(--line);border-radius:22px;padding:clamp(18px,2.4vw,26px);display:flex;flex-direction:column;gap:16px}
.sil-h{display:flex;gap:14px;align-items:center}
.sil-h>div{display:flex;flex-direction:column;gap:4px;min-width:0}
.sil-h b{font-size:17px}.sil-h>div>span{font-size:13px;color:var(--muted);line-height:1.5}
.sil-ic{flex:none;width:42px;height:42px;border-radius:13px;background:var(--navy-soft);color:var(--navy-text);display:grid;place-items:center}
.sil-ic svg{width:22px;height:22px}
.sil-in{display:flex;flex-wrap:wrap;gap:10px 14px;align-items:center}
.sil-in label{font-size:13px;font-weight:700;color:var(--muted)}
.sil-in input{height:44px;border:1px solid var(--line);border-radius:12px;padding:0 14px;font:inherit;background:var(--bg);color:inherit;min-width:0}
.sil-co{display:flex;gap:6px;background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:4px}
.sil-co button{border:0;background:transparent;border-radius:9px;padding:8px 14px;font:inherit;font-size:13px;font-weight:700;color:var(--muted);cursor:pointer}
.sil-co button[aria-pressed="true"]{background:var(--navy);color:#fff}
.sil-r{display:flex;gap:16px;align-items:center;background:var(--navy);color:#fff;border-radius:18px;padding:16px 18px}
.sil-badge{flex:none;width:62px;height:62px;border-radius:50%;background:rgba(255,255,255,.12);border:2px solid rgba(255,255,255,.35);display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1}
.sil-badge b{font-size:26px}.sil-badge span{font-size:11px;opacity:.8;margin-top:3px}
.sil-t{display:flex;flex-direction:column;gap:5px;min-width:0}
.sil-t b{font-size:20px}.sil-t small{font-size:13px;font-weight:600;opacity:.75;margin-left:4px}
.sil-t>span{font-size:13px;opacity:.8}
.sil-f{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}
.sil-f>div{background:var(--bg);border-radius:14px;padding:12px 14px;display:flex;flex-direction:column;gap:5px;min-width:0}
.sil-f span{font-size:12px;color:var(--muted);font-weight:600}.sil-f b{font-size:14.5px;line-height:1.4}
.sil-note{margin:0;font-size:13px;color:#b5651d;background:rgba(232,137,43,.1);border-radius:12px;padding:10px 14px}
.sil-bad,.sil-good{display:flex;flex-direction:column;gap:8px}
.sil-bad .k,.sil-good .k{font-size:12.5px;font-weight:800;letter-spacing:.02em}
.sil-bad .k{color:#c03a3a}.sil-good .k{color:#1f9d6b}
.sil-bad ul{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px}
.sil-bad li{position:relative;padding:11px 14px 11px 38px;border-radius:12px;background:rgba(214,69,69,.07);font-size:14.5px;line-height:1.5}
.sil-bad li::before{content:"!";position:absolute;left:12px;top:11px;width:18px;height:18px;border-radius:50%;background:#d64545;color:#fff;font-size:11px;font-weight:800;display:grid;place-items:center}
.sil-good b{font-size:14.5px;font-weight:600;padding:11px 14px;border-radius:12px;background:rgba(31,157,107,.08)}
.sil-src{margin:0;font-size:12px;color:var(--muted)}
@media (max-width:720px){.sil-f{grid-template-columns:repeat(2,minmax(0,1fr))}}
</style>

function hasOf(k){ var h=S.has[k]; if(h&&h!=="u") return h; var m=HAS_MAP[k], v=m?S.cur[m]:undefined; if(v===undefined||v==="") return h; return (Number(v)||0)>0?"y":"n"; }
function rowStatus(r){
  if(r.chk){ var h=hasOf(r.k); return h==="y"?["ok","있음"]:h==="n"?["bad","없음"]:["wait","확인 전"]; }
  var v=S.cur[r.k]; if(v===undefined||v==="") return ["wait","확인 전"];
  v=Number(v)||0; var t=tgt(r); if(v>=t) return ["ok","충분"]; if(v===0) return ["bad","없음"]; return ["bad",fmt(t-v)+(r.unit==="만원/일"?"만원/일":"만원")+" 부족"];
}
function topicSum(key){
  var need=0, have=0, gap=0, wait=0, miss=0;
  CALC[key].forEach(function(r){
    if(r.chk){ var h=hasOf(r.k); if(!h||h==="u") wait++; else if(h==="n") miss++; return; }
    if(r.unit||r.per) return;
    var t=tgt(r); need+=t; var v=S.cur[r.k];
    if(v===undefined||v===""){ wait++; return; }
    v=Number(v)||0; have+=Math.min(v,t); if(v<t){ gap+=t-v; miss++; }
  });
  var cnt=CALC[key].filter(function(r){ return r.chk||!(r.unit||r.per); }).length;
  return {need:need, have:have, gap:gap, wait:wait, miss:miss, none:wait===cnt};
}

function life(){
  var r=num(S.retAge)||Number(cfg.retire)||60, m=Number(cfg.lifeM)||83.7, f=Number(cfg.lifeF)||88.4;
  var both=Math.max(0,m-r), solo=Math.max(0,f-Math.max(m,r)), couple=Number(cfg.coupleCost)||298.1, single=Number(cfg.singleCost)||197.6;
  return {r:r,m:m,f:f,both:both,solo:solo,couple:couple,single:single,total:couple*12*both+single*12*solo,k:Math.pow(1+(Number(cfg.infl)||0)/100,30),h:Number(cfg.healthyAge)||65.5};
}
function saveCalc(){
  var y=num(S.salary)||4800, P=y/12*S.saveRate/100, n=360, r=(Number(cfg.saveRate)||3.21)/100/12;
  var fv=P*((Math.pow(1+r,n)-1)/r)*(1+r), pr=P*n, after=pr+(fv-pr)*(1-0.154), k=Math.pow(1+(Number(cfg.infl)||0)/100,30), L=life();
  return {given:!!num(S.salary), P:P, pr:pr, after:after, real:after/k, per:(after/k)/((L.both+L.solo)*12), need:L.couple};
}
function budget(){ var y=num(S.salary); return y? y/12*0.15 : 0; }
function penM(){ var v=num(S.penM); if(v!==null) return v; var pv=num(S.pv&&S.pv[3]); if(pv) return pv; var b=budget(); return b? Math.max(10,Math.round(b*0.4/5)*5) : 30; }
function guarBase(pm,yrs,toStart){ var s=0; for(var k=0;k<yrs*12;k++){ var t=toStart-k/12; s+=pm*(1+Math.min(t,30)*0.07+Math.max(0,t-30)*0.05); } return s; }
function oldGap(){ var c=prepCalc(); return {np:c.np===null?0:c.np, g:c.gap, total:c.gap*c.months, L:c.life}; }
function inhTax(estate, spouse){ var ded=50000+(spouse?50000:0), tb=Math.max(0,estate-ded), t;
  if(tb<=10000) t=tb*0.1; else if(tb<=50000) t=tb*0.2-1000; else if(tb<=100000) t=tb*0.3-6000; else if(tb<=300000) t=tb*0.4-16000; else t=tb*0.5-46000;
  return Math.max(0,t*0.97); }
function houseCalc(){ var ex=num(S.hNow)===null; var buy=(num(S.hBuy)===null?(ex?2:0):num(S.hBuy))*10000, now=(ex?10:num(S.hNow))*10000, debt=(num(S.hDebt)||0)*10000, sp=S.hSp==="y";
  var est=Math.max(0,now-debt), ded=50000+(sp?50000:0); return {ex:ex, buy:buy, now:now, tb:Math.max(0,est-ded), ded:ded, tax:inhTax(est,sp)}; }
function deathCalc(){
  var live=num(S.dLive); if(live===null) live=Number(S.monthly)||300;
  var yrs=num(S.dYears)||0, sp=num(S.dSpouse)||0, loan=num(S.dLoan)||0, edu=num(S.dEdu)||0, etc=num(S.dEtc)||0, have=num(S.dHave);
  var taxOn=num(S.hNow)!==null, tax=taxOn?houseCalc().tax:0;
  var liv=Math.max(0,live-sp)*12*yrs, need=liv+loan+edu+etc+tax;
  return {live:live, yrs:yrs, sp:sp, liv:liv, loan:loan, edu:edu, etc:etc, tax:tax, taxOn:taxOn, need:need, have:have, gap: have===null? null : Math.max(0,need-have)};
}

function qv(k){ return (S.q||{})[k]; }
function qSignals(){
  var h=0, r=0, l=0, kinds=qv("kinds")||{}, fam=qv("fam")||{}, rs=qv("reason");
  if(rs==="check"||rs==="hosp") h+=2; if(rs==="save") r+=2;
  if(!kinds.can||!kinds.brain||!kinds.heart) h++; if(qv("oldest")==="old") h++; if(qv("renew")==="y") h++;
  if(fam.can||fam.brain||fam.heart) h++; if(qv("near")) h++; if(qv("claim")==="low") h+=2;
  if(num(qv("save"))) r++; if(qv("oldprep")) r++; if(kinds.can&&kinds.brain&&kinds.heart) r++; if(!kinds.pen) r++;
  if(qv("marry")==="y"||qv("marry")==="p") l++; if(qv("kids")) l++; if(num(qv("loan"))) l++; if(qv("house")==="own") l++; if(!kinds.life) l++;
  return [["건강",h,"var(--t-cancer)"],["생활비 · 연금",r,"var(--t-pension)"],["목돈 · 종신",l,"var(--t-life)"]];
}

function applyQ(k){
  var v=qv(k);
  if(k==="age") S.age=v||"";

  else if(k==="monthly"){ if(num(v)){ S.monthly=num(v); S.mTouched=true; S.dLive=String(num(v)); } }
  else if(k==="ret"){ if(v!=null&&v!==""){ S.retPick=v; S.retAge=RET_AGES[+v][0]; } }
  else if(k==="marry"){ S.lifeMode=(v==="y"||v==="p")?"m":(v==="n"?"s":""); }
  else if(k==="loan") S.dLoan=v||"";
  else if(k==="save"){ S.pv[2]=v||""; S.prep[2]=!!num(v); }
  else if(k==="prem") S.curPrem=v||"";
}
